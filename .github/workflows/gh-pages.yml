name: gh-pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Website
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v1.2.0
        with:
          mdbook-version: "0.4.48"

      - run: mdbook build book

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.8.0

      - run: cargo xtask doc && mv target/doc book/book

      - uses: actions/upload-pages-artifact@v5
        with:
          path: book/book

  # Pull requests only check that the website builds.
  deploy:
    name: Deploy Website
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # To deploy to GitHub Pages.
      id-token: write # To prove the deployment comes from this workflow.
    # Deploy in order, and never cancel a deployment mid-way.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
