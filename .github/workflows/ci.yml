name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install fixpoint
        uses: ./.github/actions/install-fixpoint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Z3
        uses: cda-tum/setup-z3@v1.6.6
        with:
          version: 4.15.3

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.8.0
        with:
          cache-bin: false

      - name: Run tests
        run: |
          cargo xtask test --fixpoint-timeout 10

  vtock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fixpoint
        uses: ./.github/actions/install-fixpoint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Older versions hang
      - name: Install Z3
        uses: cda-tum/setup-z3@v1.6.6
        with:
          version: 4.15.3

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.8.0

      - name: Install Flux
        run: |
          cargo x install
          echo ~/.cargo/bin >> $GITHUB_PATH

      - name: Clone vtock
        run: |
          git clone https://github.com/PLSysSec/tock
          cp rust-toolchain.toml tock/rust-toolchain.toml

      - name: Patch flux-rs dependency if in pull request
        if: github.event_name == 'pull_request'
        run: |
          echo '[patch."https://github.com/flux-rs/flux.git"]' >> tock/Cargo.toml
          echo 'flux-rs = { path = "../lib/flux-rs" }' >> tock/Cargo.toml
          echo 'flux-core = { path = "../lib/flux-core" }' >> tock/Cargo.toml
          echo 'flux-alloc = { path = "../lib/flux-alloc" }' >> tock/Cargo.toml

      - name: Check tock/kernel
        run: |
          cd tock
          cargo flux -p cortexm -p rv32i

  lean-demo:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean via elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Install fixpoint
        uses: ./.github/actions/install-fixpoint
        env:
          GITHUB_TOKEN:
            ${{ secrets.GITHUB_TOKEN }}

            # Older versions hang
      - name: Install Z3
        uses: cda-tum/setup-z3@v1.6.6
        with:
          version: 4.15.3

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.8.0

      - name: Install Flux
        run: |
          cargo x install
          echo ~/.cargo/bin >> $GITHUB_PATH

      - name: Clone flux-to-lean-demo
        run: |
          git clone https://github.com/flux-rs/flux-to-lean-demo

      - name: Patch flux-rs dependency if in pull request
        if: github.event_name == 'pull_request'
        run: |
          echo '[patch."https://github.com/flux-rs/flux.git"]' >> flux-to-lean-demo/Cargo.toml
          echo 'flux-rs = { path = "../lib/flux-rs" }' >> flux-to-lean-demo/Cargo.toml
          echo 'flux-core = { path = "../lib/flux-core" }' >> flux-to-lean-demo/Cargo.toml
          echo 'flux-alloc = { path = "../lib/flux-alloc" }' >> flux-to-lean-demo/Cargo.toml

      - name: Run lean demo
        working-directory: flux-to-lean-demo
        run: |
          bash runlean.sh

  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.8.0

      - name: Rust rustfmt
        run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.8.0

      - name: Run cargo check
        run: RUSTFLAGS="-Dwarnings" cargo check

      - name: Run clippy
        run: cargo clippy

  deploy:
    # Deploys the flux sysroot to the playground server. Configured through
    # variables. DEPLOY_TARGET and DEPLOY_RUNNER are read by `if`/`runs-on`, which
    # are evaluated before the environment is attached, so they must be
    # repository variables; the rest may also be `playground` environment ones.
    #   DEPLOY_TARGET       ssh destination as user@host; the job is skipped when unset
    #   DEPLOY_KNOWN_HOSTS  pinned `ssh-keyscan [-p <port>] <host>` output, verified out of band
    #   DEPLOY_PORT         (optional) ssh port, default 22
    #   DEPLOY_RUNNER       (optional) runner image; its glibc must not be newer
    #                       than the server's, or the binaries won't run there
    # and the FLUX_DEPLOY_KEY secret, whose public key is restricted on the
    # server to tools/flux-deploy.
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-22.04' }}
    needs: [tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_TARGET != ''
    environment: playground
    # Serialize deploys; never cancel one mid-way through the upload/swap.
    concurrency:
      group: playground-deploy
      cancel-in-progress: false
    env:
      DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.8.0
        with:
          cache-bin: false

      - name: Build and install flux sysroot
        run: cargo x install

      - name: Copy flux binary into sysroot directory
        run: cp ~/.cargo/bin/flux ~/.flux/sysroot/flux

      # The solvers ship inside the sysroot so the server runs exactly the
      # versions flux was tested with; the playground service puts
      # ~/.flux/sysroot/bin on its PATH.
      - name: Install fixpoint
        uses: ./.github/actions/install-fixpoint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Z3
        uses: cda-tum/setup-z3@v1.6.6
        with:
          version: 4.15.3

      - name: Copy fixpoint and z3 into sysroot bin directory
        run: |
          mkdir -p ~/.flux/sysroot/bin
          cp "$(readlink -f "$(command -v fixpoint)")" ~/.flux/sysroot/bin/fixpoint
          cp "$(readlink -f "$(command -v z3)")" ~/.flux/sysroot/bin/z3

      - name: Stamp build with commit timestamp and toolchain info
        run: |
          git log -1 --format='%ct' > ~/.flux/sysroot/version
          # use sed to parse toml because `tomllib` needs Python 3.11+, which ubuntu-22.04
          # doesn't ship. Assumes channel and components are each on a single line.
          sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
            rust-toolchain.toml > ~/.flux/sysroot/toolchain-channel
          components=$(sed -n 's/^[[:space:]]*components[[:space:]]*=[[:space:]]*\[\(.*\)\].*/\1/p' rust-toolchain.toml | tr -d '",')
          echo $components > ~/.flux/sysroot/toolchain-components

      - name: Set up SSH key
        env:
          FLUX_DEPLOY_KEY: ${{ secrets.FLUX_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        run: |
          for v in DEPLOY_KNOWN_HOSTS FLUX_DEPLOY_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set" >&2
              exit 1
            fi
          done
          mkdir -p ~/.ssh
          printf '%s\n' "$FLUX_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          # Used by both ssh and rsync, so the target stays a plain user@host.
          if [ -n "$DEPLOY_PORT" ]; then
            if [[ ! "$DEPLOY_PORT" =~ ^[0-9]+$ ]]; then
              echo "::error::DEPLOY_PORT must be a number" >&2
              exit 1
            fi
            printf 'Host %s\n  Port %s\n' "${DEPLOY_TARGET#*@}" "$DEPLOY_PORT" >> ~/.ssh/config
            chmod 600 ~/.ssh/config
          fi

      - name: Compute deploy ID
        # Unique per run and per attempt, so re-runs never upload into the
        # directory that is currently live on the server.
        run: echo "DEPLOY_ID=$(git rev-parse HEAD)-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"

      - name: Rsync flux sysroot to per-run staging directory on server
        run: |
          # Destination is relative: rrsync (the forced command on the server)
          # roots it under ~/.flux-staging, so this lands in ~/.flux-staging/sysroot/$DEPLOY_ID.
          rsync -az --delete ~/.flux/sysroot/ "$DEPLOY_TARGET:sysroot/$DEPLOY_ID/"

      - name: Atomically swap sysroot on server
        run: ssh "$DEPLOY_TARGET" "flux-deploy sysroot $DEPLOY_ID"
